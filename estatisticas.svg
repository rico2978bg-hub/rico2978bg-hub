    .valor { font-size: 24px; font-weight: 800; }
    .rotulo { font-size: 11px; fill-opacity: .85; }
  </style>
  <rect width="840" height="190" rx="24" fill="url(#fundo)"/>
  <circle cx="800" cy="10" r="90" fill="#ffffff" fill-opacity=".07"/>
  <text x="24" y="40" class="titulo">Meu GitHub em números</text>
  <text x="816" y="40" class="sub" text-anchor="end">atualizado em 27/11/2026</text>
    <g>
      <rect x="24.0" y="62" width="148.8" height="106" rx="18" fill="#ffffff" fill-opacity=".14"/>
      <rect x="38.0" y="76" width="34" height="34" rx="11" fill="#ff7a59"/>
      <text x="55.0" y="99" font-size="17" text-anchor="middle">🔥</text>
