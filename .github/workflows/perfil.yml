# Atualiza as imagens do perfil (cobrinha dos commits e cartão de estatísticas)
# todo dia e a cada mudança. As imagens ficam na branch "output".
name: Atualizar perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cobrinha dos commits
        # Fixado no commit exato da v3.5.0 para ninguém trocar o código por trás da versão.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            saida/cobrinha.svg?palette=github&color_snake=#1e9e57&color_dots=#ebedf0,#b7ebcb,#6fd39a,#2fb36d,#13804a
            saida/cobrinha-escura.svg?palette=github-dark&color_snake=#4cc38a

      - name: Cartão de estatísticas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F login='${{ github.repository_owner }}' -f query="$(cat scripts/consulta.graphql)" > dados.json
          python3 scripts/cartao.py dados.json saida/estatisticas.svg

      - name: Publicar na branch output
        run: |
          cd saida
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Atualiza imagens do perfil"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
