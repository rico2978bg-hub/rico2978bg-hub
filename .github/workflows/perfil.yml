# Atualiza o cartão de estatísticas do perfil todo dia e a cada mudança.
# A imagem fica na branch "output".
name: Atualizar perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cartão de estatísticas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p saida
          gh api graphql -F login='${{ github.repository_owner }}' -f query="$(cat scripts/consulta.graphql)" > dados.json
          python3 scripts/cartao.py dados.json saida/estatisticas.svg

      - name: Publicar na branch output
        run: |
          cd saida
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Atualiza imagens do perfil"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
